name: Build pydantic-core for Android

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"
  ANDROID_API: "24"
  NDK_VERSION: "25.2.9519653"
  VERSION: "2.46.5"
  TARGET: "aarch64-linux-android"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: NDK
        run: |
          yes | sdkmanager "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -eux

          python -m pip install -U pip setuptools wheel
          python -m pip install "maturin>=1.10,<2"

          mkdir -p build_src
          cd build_src

          python -m pip download \
            "pydantic-core==${VERSION}" \
            --no-binary=:all: \
            --no-deps

          tar -xzf pydantic_core-*.tar.gz
          cd pydantic_core-*

          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$NDK/bin"

          export PATH="$BIN:$PATH"

          export CC_aarch64_linux_android="$BIN/aarch64-linux-android${ANDROID_API}-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android${ANDROID_API}-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$BIN/llvm-ranlib"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android${ANDROID_API}-clang"

          MOCK="$GITHUB_WORKSPACE/mock_python"
          mkdir -p "$MOCK"

          "$CC_aarch64_linux_android" \
            -shared \
            -Wl,-soname,libpython3.14.so \
            -o "$MOCK/libpython3.14.so" \
            -xc /dev/null

          cat > "$MOCK/_sysconfigdata__linux_aarch64-linux-android.py" <<EOF
          build_time_vars = {
              "ABIFLAGS": "",
              "abiflags": "",
              "SO": ".so",
              "SOABI": "cpython-314",
              "EXT_SUFFIX": ".so",
              "VERSION": "3.14",
              "LIBDIR": "$MOCK",
              "LDLIBRARY": "libpython3.14.so",
              "Py_ENABLE_SHARED": 1,
              "CC": "$CC_aarch64_linux_android",
              "CXX": "$CXX_aarch64_linux_android",
              "LDSHARED": "$CC_aarch64_linux_android -shared",
              "LDFLAGS": "",
              "CCSHARED": "-fPIC",
              "Py_DEBUG": 0,
              "WITH_PYMALLOC": 1,
          }
          EOF

          export PYO3_CROSS_LIB_DIR="$MOCK"
          export PYO3_CROSS_PYTHON_VERSION="$PYTHON_VERSION"
          export PYTHONPATH="$MOCK"
          export _PYTHON_SYSCONFIGDATA_NAME="_sysconfigdata__linux_aarch64-linux-android"

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$BIN/aarch64-linux-android${ANDROID_API}-clang"
          ar = "$BIN/llvm-ar"
          EOF

          maturin build \
            --release \
            --strip \
            --target "$TARGET" \
            --interpreter python3.14 \
            --compatibility off

      - name: Show wheel
        run: |
          ls -lh build_src/pydantic_core-*/target/wheels/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pydantic-core-${{ env.VERSION }}-android-arm64-cp314
          path: build_src/pydantic_core-*/target/wheels/*.whl
          if-no-files-found: error
          retention-days: 30
