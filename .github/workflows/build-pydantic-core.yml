name: Build pydantic-core for Android

on:
  workflow_dispatch:

env:
  ANDROID_API: 24
  NDK_VERSION: "25.2.9519653"
  PYTHON_VERSION: "3.14"

jobs:
  build:
    name: Android ARM64 / Python 3.14
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # RUST
      # ============================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # ANDROID NDK
      # ============================================================

      - name: Install Android NDK
        run: |
          yes | sdkmanager "ndk;${NDK_VERSION}" >/dev/null

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # ============================================================
      # MATURIN
      # ============================================================

      - name: Install Maturin
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin

      # ============================================================
      # DOWNLOAD PYDANTIC-CORE SOURCE
      # ============================================================

      - name: Download pydantic-core source
        run: |
          set -eux

          mkdir -p build_src

          cd build_src

          python -m pip download \
            pydantic-core \
            --no-binary :all: \
            --no-deps

          tar -xzf pydantic_core-*.tar.gz

          SOURCE_DIR="$(find "$PWD" \
            -maxdepth 1 \
            -type d \
            -name 'pydantic_core-*' \
            | head -n 1)"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Source directory:"
          echo "$SOURCE_DIR"

      # ============================================================
      # BUILD ANDROID WHEEL
      # ============================================================

      - name: Build Android wheel
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux

          # --------------------------------------------------------
          # NDK PATHS
          # --------------------------------------------------------

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          export PATH="$NDK_BIN:$PATH"

          # --------------------------------------------------------
          # ANDROID C/C++ COMPILERS
          # --------------------------------------------------------

          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android${ANDROID_API}-clang"

          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android${ANDROID_API}-clang++"

          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"

          export RANLIB_aarch64_linux_android="$NDK_BIN/llvm-ranlib"

          # --------------------------------------------------------
          # CARGO LINKER
          # --------------------------------------------------------

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android${ANDROID_API}-clang"

          # --------------------------------------------------------
          # SHOW TOOLCHAIN
          # --------------------------------------------------------

          echo "============================================"
          echo "ANDROID TOOLCHAIN"
          echo "============================================"

          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          echo "Compiler:"
          echo "$CC_aarch64_linux_android"

          echo "C++ compiler:"
          echo "$CXX_aarch64_linux_android"

          echo "Cargo linker:"
          echo "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"

          "$CC_aarch64_linux_android" --version

          # ========================================================
          # MOCK PYTHON LIBRARY FOR PYO3
          # ========================================================

          MOCK_DIR="$GITHUB_WORKSPACE/mock_python"

          mkdir -p "$MOCK_DIR"

          echo "============================================"
          echo "CREATING MOCK PYTHON"
          echo "============================================"

          "$NDK_BIN/clang" \
            --target=aarch64-linux-android${ANDROID_API} \
            -shared \
            -Wl,-soname,libpython3.14.so \
            -o "$MOCK_DIR/libpython3.14.so" \
            -xc /dev/null

          # --------------------------------------------------------
          # FIND ANDROID libdl
          # --------------------------------------------------------

          LIBDL_PATH="$(
            find "$NDK_SYSROOT" \
              -path '*aarch64-linux-android*' \
              -name 'libdl.so' \
              | head -n 1
          )"

          if [ -n "$LIBDL_PATH" ]; then
            cp "$LIBDL_PATH" "$MOCK_DIR/"
          fi

          # --------------------------------------------------------
          # PYTHON SYSCONFIG
          # --------------------------------------------------------

          SYSCONFIG_NAME="_sysconfigdata__linux_aarch64-linux-android"

          cat > "$MOCK_DIR/${SYSCONFIG_NAME}.py" <<'PY'
          build_time_vars = {
              "abiflags": "",
              "ABIFLAGS": "",

              "SO": ".so",
              "SOABI": "cpython-314",
              "EXT_SUFFIX": ".so",

              "LIBDIR": "__MOCK_DIR__",

              "LDLIBRARY": "libpython3.14.so",
              "Py_ENABLE_SHARED": 1,

              "CC": "clang",
              "CXX": "clang++",

              "VERSION": "3.14",

              "LDSHARED": "clang -shared",

              "LDFLAGS": "",
              "CCSHARED": "-fPIC",

              "GNULD": "yes",

              "Py_DEBUG": 0,
              "WITH_PYMALLOC": 1,
          }
          PY

          sed -i "s|__MOCK_DIR__|$MOCK_DIR|g" \
            "$MOCK_DIR/${SYSCONFIG_NAME}.py"

          # ========================================================
          # PYO3 CROSS COMPILATION
          # ========================================================

          export PYO3_CROSS_LIB_DIR="$MOCK_DIR"

          export PYO3_CROSS_PYTHON_VERSION="$PYTHON_VERSION"

          # IMPORTANT:
          # GitHub Actions normally does NOT define PYTHONPATH.
          # With `set -u`, `$PYTHONPATH` would therefore crash.
          #
          # `${PYTHONPATH:-}` safely expands to an empty string
          # when PYTHONPATH does not exist.

          export PYTHONPATH="$MOCK_DIR${PYTHONPATH:+:$PYTHONPATH}"

          export _PYTHON_SYSCONFIGDATA_NAME="$SYSCONFIG_NAME"

          # ========================================================
          # DISPLAY PYO3 CONFIG
          # ========================================================

          echo "============================================"
          echo "PYO3 CONFIGURATION"
          echo "============================================"

          echo "PYO3_CROSS_LIB_DIR:"
          echo "$PYO3_CROSS_LIB_DIR"

          echo "PYO3_CROSS_PYTHON_VERSION:"
          echo "$PYO3_CROSS_PYTHON_VERSION"

          echo "PYTHONPATH:"
          echo "$PYTHONPATH"

          echo "PYTHON SYSCONFIG:"
          echo "$_PYTHON_SYSCONFIGDATA_NAME"

          echo "Mock directory:"
          ls -lah "$MOCK_DIR"

          # ========================================================
          # ANDROID LINKER FLAGS
          # ========================================================

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="\
          -L native=$MOCK_DIR \
          -C link-arg=--target=aarch64-linux-android${ANDROID_API} \
          -C link-arg=-Wl,--no-as-needed \
          -C link-arg=-lpython3.14 \
          -C link-arg=-Wl,--as-needed \
          -C link-arg=-Wl,--unresolved-symbols=ignore-all \
          -C link-arg=-Wl,-rpath=/data/data/com.termux/files/usr/lib"

          # ========================================================
          # BUILD
          # ========================================================

          echo "============================================"
          echo "BUILDING PYDANTIC-CORE"
          echo "============================================"

          maturin build \
            --release \
            --strip \
            --target aarch64-linux-android \
            --interpreter python3.14 \
            --skip-auditwheel

      # ============================================================
      # SHOW RESULT
      # ============================================================

      - name: Show wheel
        run: |
          echo "============================================"
          echo "GENERATED WHEEL"
          echo "============================================"

          ls -lh "${{ env.SOURCE_DIR }}/target/wheels/"

          echo
          echo "File information:"
          file "${{ env.SOURCE_DIR }}"/target/wheels/*

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pydantic-core-android-aarch64-cp314
          path: ${{ env.SOURCE_DIR }}/target/wheels/*.whl
          retention-days: 7
