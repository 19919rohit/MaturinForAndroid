name: Build Android ARM64 Wheel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-wheel:

    name: Tornado CPython 3.14 Android ARM64

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # ======================================================
      # SYSTEM
      # ======================================================

      - name: Show build environment
        run: |
          set -eux

          echo "============================================================"
          echo "NEUNIX STUDIOS"
          echo "Android Wheel Builder"
          echo "============================================================"

          echo
          echo "Runner:"
          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "Python:"
          python --version

          echo
          echo "Python details:"
          python - <<'PY'
          import sys
          import sysconfig

          print("Version :", sys.version)
          print("Platform:", sysconfig.get_platform())
          print("ABI     :", sys.implementation.cache_tag)
          PY

      # ======================================================
      # BUILD TOOL
      # ======================================================

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cibuildwheel==4.2.0"

      # ======================================================
      # BUILD ANDROID WHEEL
      # ======================================================

      - name: Build Android ARM64 wheel
        env:
          CIBW_PLATFORM: android
          CIBW_ARCHS_ANDROID: arm64_v8a

          # EXACT TARGET
          CIBW_BUILD: cp314-android_arm64_v8a

          # Android minimum API
          ANDROID_API_LEVEL: "24"

          # Use modern build frontend.
          CIBW_BUILD_FRONTEND: build

          # Verbose output
          CIBW_BUILD_VERBOSITY: 1

        run: |
          set -eux

          echo "============================================================"
          echo "BUILDING ANDROID WHEEL"
          echo "============================================================"

          python -m cibuildwheel \
            --platform android \
            --archs arm64_v8a \
            --output-dir wheelhouse

      # ======================================================
      # INSPECT WHEEL
      # ======================================================

      - name: Inspect generated wheel
        run: |
          set -eux

          echo "============================================================"
          echo "GENERATED WHEELS"
          echo "============================================================"

          ls -lah wheelhouse/

          echo
          echo "Wheel filenames:"
          find wheelhouse -maxdepth 1 -type f -name "*.whl" -print

          echo
          echo "Wheel metadata:"
          python -m pip install wheel

          for wheel in wheelhouse/*.whl; do
            echo
            echo "------------------------------------------------------------"
            echo "$wheel"
            echo "------------------------------------------------------------"

            python -m wheel tags "$wheel" || true
          done

      # ======================================================
      # VERIFY WHEEL TAG
      # ======================================================

      - name: Verify Android ARM64 CPython 3.14 wheel
        run: |
          set -eux

          wheel_count=$(find wheelhouse -maxdepth 1 -type f \
            -name "tornado-*-cp314-cp314-android_24_arm64_v8a.whl" \
            | wc -l)

          echo "Matching wheels: $wheel_count"

          if [ "$wheel_count" -eq 0 ]; then
            echo
            echo "ERROR: Expected Android ARM64 CPython 3.14 wheel was not produced."
            echo
            echo "Expected pattern:"
            echo "tornado-*-cp314-cp314-android_24_arm64_v8a.whl"
            exit 1
          fi

          echo
          echo "SUCCESS:"
          find wheelhouse -maxdepth 1 -type f \
            -name "tornado-*-cp314-cp314-android_24_arm64_v8a.whl"

      # ======================================================
      # UPLOAD ARTIFACT
      # ======================================================

      - name: Upload Android wheel
        uses: actions/upload-artifact@v6
        with:
          name: tornado-cp314-android-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
