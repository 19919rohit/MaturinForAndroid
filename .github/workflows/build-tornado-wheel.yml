name: Build Tornado Android ARM64 Wheel

on:
  workflow_dispatch:

jobs:
  build:
    name: Tornado - Android ARM64 - CPython 3.14
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # ============================================================
      # SYSTEM
      # ============================================================

      - name: Show environment
        run: |
          set -eux

          python --version
          python -c "import sys; print(sys.version)"
          python -c "import platform; print(platform.platform())"

      # ============================================================
      # INSTALL BUILD TOOLS
      # ============================================================

      - name: Install cibuildwheel
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            cibuildwheel==4.2.0 \
            build \
            packaging

          cibuildwheel \
            --print-build-identifiers \
            --platform android \
            --archs arm64_v8a

      # ============================================================
      # CREATE TEMPORARY TORNADO PACKAGE
      # ============================================================

      - name: Prepare Tornado source
        shell: bash
        run: |
          set -eux

          rm -rf tornado-build
          mkdir -p tornado-build

          cd tornado-build

          git clone \
            --depth 1 \
            https://github.com/tornadoweb/tornado.git \
            .

          echo
          echo "Tornado source:"
          git log -1 --oneline

          echo
          echo "Project files:"
          ls -la

          test -f pyproject.toml

      # ============================================================
      # BUILD ANDROID WHEEL
      # ============================================================

      - name: Build Android ARM64 wheel
        env:
          CIBW_PLATFORM: android
          CIBW_ARCHS: arm64_v8a

          # Target Android API 24.
          CIBW_ANDROID_API_LEVEL: "24"

          # CPython 3.14 only.
          CIBW_BUILD: "cp314-android_arm64_v8a"

          # Do not test the wheel on the Ubuntu host.
          CIBW_TEST_SKIP: "*"

        run: |
          set -eux

          cd tornado-build

          mkdir -p ../wheelhouse

          cibuildwheel \
            --platform android \
            --archs arm64_v8a \
            --only cp314-android_arm64_v8a \
            --output-dir ../wheelhouse \
            .

      # ============================================================
      # INSPECT RESULT
      # ============================================================

      - name: Inspect wheel
        run: |
          set -eux

          echo "============================================================"
          echo "WHEELHOUSE"
          echo "============================================================"

          find wheelhouse \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

          echo
          echo "============================================================"
          echo "WHEEL DETAILS"
          echo "============================================================"

          python -m zipfile -l wheelhouse/*.whl | head -100

      # ============================================================
      # VERIFY WHEEL TAG
      # ============================================================

      - name: Verify Android wheel
        run: |
          set -eux

          shopt -s nullglob

          wheels=(wheelhouse/*.whl)

          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "ERROR: No wheel was produced."
            exit 1
          fi

          for wheel in "${wheels[@]}"; do
            echo
            echo "Produced:"
            basename "$wheel"

            case "$(basename "$wheel")" in
              *cp314*android_24_arm64_v8a.whl)
                echo "Android CPython 3.14 ARM64 wheel: OK"
                ;;
              *)
                echo "WARNING: Unexpected wheel tag:"
                basename "$wheel"
                ;;
            esac
          done

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Android wheel
        uses: actions/upload-artifact@v4
        with:
          name: tornado-android-cp314-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
