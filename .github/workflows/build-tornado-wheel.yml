name: Build Tornado Android ARM64

on:
  workflow_dispatch:

jobs:
  build-tornado:
    name: Tornado Android CPython 3.14 ARM64
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # ============================================================
      # SYSTEM
      # ============================================================

      - name: Show environment
        run: |
          set -eux

          echo "============================================================"
          echo "SYSTEM"
          echo "============================================================"

          python --version
          python -c "import sys; print(sys.version)"
          python -c "import platform; print(platform.platform())"

      # ============================================================
      # INSTALL BUILD TOOLS
      # ============================================================

      - name: Install cibuildwheel
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            cibuildwheel==4.2.0 \
            build \
            packaging

          echo
          echo "cibuildwheel:"
          python -m cibuildwheel --help | head -30

      # ============================================================
      # GET TORNADO
      # ============================================================

      - name: Clone Tornado
        run: |
          set -eux

          rm -rf tornado-build

          git clone \
            --depth 1 \
            https://github.com/tornadoweb/tornado.git \
            tornado-build

          echo
          echo "============================================================"
          echo "TORNADO SOURCE"
          echo "============================================================"

          cd tornado-build

          git log -1 --oneline

          echo
          echo "Root files:"
          ls -la

          echo
          echo "Python metadata:"

          if [ -f pyproject.toml ]; then
            echo "pyproject.toml: FOUND"
          else
            echo "ERROR: pyproject.toml missing"
            exit 1
          fi

      # ============================================================
      # SHOW BUILD IDENTIFIERS
      # ============================================================

      - name: Show Android build identifiers
        working-directory: tornado-build
        run: |
          set -eux

          echo "============================================================"
          echo "ANDROID BUILD IDENTIFIERS"
          echo "============================================================"

          cibuildwheel \
            --platform android \
            --archs arm64_v8a \
            --print-build-identifiers \
            .

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Tornado Android wheel
        working-directory: tornado-build
        env:
          CIBW_PLATFORM: android
          CIBW_ARCHS: arm64_v8a

          # Android API level.
          CIBW_ANDROID_API_LEVEL: "24"

          # CPython 3.14 / Android ARM64.
          CIBW_BUILD: "cp314-android_arm64_v8a"

          # Android wheel cannot be tested directly on Ubuntu.
          CIBW_TEST_SKIP: "*"

        run: |
          set -eux

          mkdir -p ../wheelhouse

          echo "============================================================"
          echo "BUILDING TORNADO"
          echo "============================================================"

          cibuildwheel \
            --platform android \
            --archs arm64_v8a \
            --only cp314-android_arm64_v8a \
            --output-dir ../wheelhouse \
            .

      # ============================================================
      # INSPECT
      # ============================================================

      - name: Inspect generated wheel
        run: |
          set -eux

          echo "============================================================"
          echo "WHEELHOUSE"
          echo "============================================================"

          find wheelhouse \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

          echo
          echo "============================================================"
          echo "FILE SIZES"
          echo "============================================================"

          ls -lh wheelhouse/

      # ============================================================
      # VALIDATE
      # ============================================================

      - name: Validate wheel
        run: |
          set -eux

          shopt -s nullglob

          wheels=(wheelhouse/*.whl)

          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "ERROR: No wheel was produced."
            exit 1
          fi

          for wheel in "${wheels[@]}"; do
            name="$(basename "$wheel")"

            echo
            echo "Wheel:"
            echo "$name"

            case "$name" in
              *cp314*android_24_arm64_v8a.whl)
                echo "Android CPython 3.14 ARM64: OK"
                ;;
              *)
                echo "ERROR: Unexpected wheel tag."
                exit 1
                ;;
            esac
          done

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Tornado Android wheel
        uses: actions/upload-artifact@v4
        with:
          name: tornado-android-cp314-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
