name: Build Tornado Android ARM64 Wheel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tornado:

    name: Tornado CPython 3.14 Android ARM64

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # SYSTEM
      # ============================================================

      - name: Show runner
        run: |
          set -eux

          echo "============================================================"
          echo " NEUNIX STUDIOS"
          echo " Tornado Android Wheel Builder"
          echo "============================================================"

          echo
          uname -a

          echo
          python3 --version

      # ============================================================
      # PYTHON 3.14
      # ============================================================

      - name: Setup Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # ============================================================
      # DOWNLOAD TORNADO SOURCE
      # ============================================================

      - name: Download Tornado source
        run: |
          set -eux

          TORNADO_VERSION="6.5.4"

          mkdir -p source

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            "https://files.pythonhosted.org/packages/source/t/tornado/tornado-${TORNADO_VERSION}.tar.gz" \
            -o tornado.tar.gz

          tar -xzf tornado.tar.gz -C source

          echo
          echo "============================================================"
          echo " TORNADO SOURCE"
          echo "============================================================"

          find source -maxdepth 2 -type f | head -100

          echo
          ls -lah source/

      # ============================================================
      # INSTALL CIBUILDWHEEL
      # ============================================================

      - name: Install cibuildwheel
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            "cibuildwheel==4.2.0"

          cibuildwheel --version

      # ============================================================
      # BUILD ANDROID WHEEL
      # ============================================================

      - name: Build Tornado Android ARM64 wheel
        env:
          CIBW_PLATFORM: android

          CIBW_ARCHS_ANDROID: arm64_v8a

          CIBW_BUILD: cp314-android_arm64_v8a

          ANDROID_API_LEVEL: "24"

          CIBW_BUILD_FRONTEND: build

          CIBW_BUILD_VERBOSITY: "1"

        run: |
          set -eux

          echo "============================================================"
          echo " BUILDING TORNADO"
          echo "============================================================"

          TORNADO_DIR="$(find "$GITHUB_WORKSPACE/source" \
            -maxdepth 1 \
            -type d \
            -name 'tornado-*' \
            | head -1)"

          echo
          echo "Source directory:"
          echo "$TORNADO_DIR"

          if [ ! -f "$TORNADO_DIR/pyproject.toml" ] &&
             [ ! -f "$TORNADO_DIR/setup.py" ] &&
             [ ! -f "$TORNADO_DIR/setup.cfg" ]; then

            echo
            echo "ERROR: Tornado packaging files not found."
            find "$TORNADO_DIR" -maxdepth 2 -type f
            exit 1

          fi

          echo
          echo "Packaging files:"
          ls -lah "$TORNADO_DIR"/pyproject.toml \
                  "$TORNADO_DIR"/setup.py \
                  "$TORNADO_DIR"/setup.cfg \
                  2>/dev/null || true

          echo
          echo "Starting cibuildwheel..."

          python -m cibuildwheel \
            "$TORNADO_DIR" \
            --platform android \
            --archs arm64_v8a \
            --output-dir "$GITHUB_WORKSPACE/wheelhouse"

      # ============================================================
      # LIST RESULT
      # ============================================================

      - name: Inspect wheel
        run: |
          set -eux

          echo "============================================================"
          echo " GENERATED WHEELS"
          echo "============================================================"

          mkdir -p wheelhouse

          ls -lah wheelhouse/

          echo
          echo "Files:"
          find wheelhouse \
            -maxdepth 1 \
            -type f \
            -name "*.whl" \
            -print

      # ============================================================
      # VERIFY EXACT TARGET
      # ============================================================

      - name: Verify Android wheel
        run: |
          set -eux

          echo "============================================================"
          echo " VERIFYING TARGET"
          echo "============================================================"

          MATCHES=$(find wheelhouse \
            -maxdepth 1 \
            -type f \
            -name "tornado-*-cp314-cp314-android_24_arm64_v8a.whl" \
            | wc -l)

          echo
          echo "Matching wheels: $MATCHES"

          if [ "$MATCHES" -ne 1 ]; then
            echo
            echo "ERROR:"
            echo "Expected exactly one:"
            echo
            echo "tornado-*-cp314-cp314-android_24_arm64_v8a.whl"
            echo
            echo "Actually produced:"
            find wheelhouse -type f -name "*.whl"
            exit 1
          fi

          WHEEL=$(find wheelhouse \
            -maxdepth 1 \
            -type f \
            -name "tornado-*-cp314-cp314-android_24_arm64_v8a.whl")

          echo
          echo "SUCCESS!"
          echo
          echo "$WHEEL"

          echo
          echo "Size:"
          ls -lh "$WHEEL"

      # ============================================================
      # WHEEL CONTENTS
      # ============================================================

      - name: Inspect wheel contents
        run: |
          set -eux

          WHEEL=$(find wheelhouse \
            -maxdepth 1 \
            -type f \
            -name "*.whl" \
            | head -1)

          echo "============================================================"
          echo " WHEEL CONTENTS"
          echo "============================================================"

          unzip -l "$WHEEL"

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Android wheel
        uses: actions/upload-artifact@v6
        with:
          name: tornado-cp314-android-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
