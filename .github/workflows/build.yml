name: Build Maturin for Android Termux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Maturin
        uses: actions/checkout@v4
        with:
          repository: PyO3/maturin
          ref: v1.14.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Configure Android linker
        shell: bash
        run: |
          set -e

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Build Maturin
        run: |
          cargo build \
            --release \
            --target aarch64-linux-android \
            --bin maturin

      - name: Verify binary
        run: |
          set -e

          BINARY="target/aarch64-linux-android/release/maturin"

          test -f "$BINARY"
          test -x "$BINARY"

          file "$BINARY"
          ls -lh "$BINARY"

      - name: Prepare artifact
        run: |
          mkdir -p dist

          cp target/aarch64-linux-android/release/maturin \
             dist/maturin-aarch64-linux-android

          chmod +x dist/maturin-aarch64-linux-android

          sha256sum dist/maturin-aarch64-linux-android

      - name: Upload Maturin
        uses: actions/upload-artifact@v4
        with:
          name: maturin-aarch64-linux-android
          path: dist/maturin-aarch64-linux-android
          if-no-files-found: error
