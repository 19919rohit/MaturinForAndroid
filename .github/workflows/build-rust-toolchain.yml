name: Build Rust Compiler for Android

on:
  workflow_dispatch:

jobs:
  build-rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Rust
        uses: actions/checkout@v4
        with:
          repository: rust-lang/rust
          ref: master
          fetch-depth: 1

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager --install "ndk;29.0.14206865"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            cmake \
            ninja-build \
            python3 \
            curl \
            git \
            pkg-config \
            libssl-dev \
            build-essential

      - name: Install Rust stage0 toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Android tools
        shell: bash
        run: |
          set -euxo pipefail

          NDK="$ANDROID_NDK_HOME"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$LLVM/aarch64-linux-android24-clang"
          test -x "$LLVM/aarch64-linux-android24-clang++"
          test -x "$LLVM/llvm-ar"

          mkdir -p android-tools

          ln -sf \
            "$LLVM/aarch64-linux-android24-clang" \
            android-tools/aarch64-linux-android-clang

          ln -sf \
            "$LLVM/aarch64-linux-android24-clang++" \
            android-tools/aarch64-linux-android-clang++

          ln -sf \
            "$LLVM/llvm-ar" \
            android-tools/aarch64-linux-android-ar

          cat > android-tools/aarch64-linux-android-linker <<EOF
          #!/bin/bash
          exec "$LLVM/aarch64-linux-android24-clang" "\$@"
          EOF

          chmod +x android-tools/aarch64-linux-android-linker

          echo "=== Android tools ==="
          ls -lah android-tools

          echo "=== NDK ==="
          "$LLVM/aarch64-linux-android24-clang" --version

      - name: Write bootstrap configuration
        shell: bash
        run: |
          set -euxo pipefail

          cat > bootstrap.toml <<EOF
          change-id = 99999

          [build]
          build = "x86_64-unknown-linux-gnu"
          host = ["aarch64-linux-android"]
          target = ["aarch64-linux-android"]
          jobs = 2
          extended = false

          [rust]
          optimize = true
          debug = false
          debuginfo-level = 0

          [llvm]
          download-ci-llvm = true

          [target.aarch64-linux-android]
          cc = "${GITHUB_WORKSPACE}/android-tools/aarch64-linux-android-clang"
          cxx = "${GITHUB_WORKSPACE}/android-tools/aarch64-linux-android-clang++"
          linker = "${GITHUB_WORKSPACE}/android-tools/aarch64-linux-android-linker"
          ar = "${GITHUB_WORKSPACE}/android-tools/aarch64-linux-android-ar"
          android-ndk = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"

          [target.x86_64-unknown-linux-gnu]
          cc = "clang"
          cxx = "clang++"
          linker = "clang"
          ar = "llvm-ar"
          EOF

          echo "================================================"
          echo "bootstrap.toml"
          echo "================================================"
          cat bootstrap.toml

      - name: Verify bootstrap environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Rust ==="
          rustc --version
          cargo --version

          echo "=== Host ==="
          rustc -vV

          echo "=== NDK ==="
          echo "$ANDROID_NDK_HOME"

          echo "=== Target compiler ==="
          android-tools/aarch64-linux-android-clang \
            --version

          echo "=== Disk ==="
          df -h

          echo "=== Memory ==="
          free -h

      - name: Build Android rustc
        shell: bash
        run: |
          set -euxo pipefail

          ./x.py \
            --verbose \
            build \
            --stage 1 \
            compiler/rustc

      - name: Locate rustc
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== rustc binaries ==="

          find build \
            -type f \
            \( -name rustc -o -name rustc.exe \) \
            -print 2>/dev/null || true

          echo "=== Android files ==="

          find build \
            -type f \
            -path '*aarch64-linux-android*' \
            -print 2>/dev/null | head -100 || true

      - name: System diagnostics
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD DIAGNOSTICS"
          echo "========================================"

          echo "=== Exit environment ==="
          env | sort | grep -E \
            '^(RUST|CARGO|ANDROID|CC|CXX|AR|PATH)=' || true

          echo
          echo "=== Disk ==="
          df -h

          echo
          echo "=== Memory ==="
          free -h

          echo
          echo "=== Processes ==="
          ps aux --sort=-%mem | head -30 || true

          echo
          echo "=== Build directory ==="
          du -sh build 2>/dev/null || true

          echo
          echo "=== Recent files ==="
          find build -type f -printf '%T@ %p\n' \
            2>/dev/null \
            | sort -nr \
            | head -50 || true

      - name: Package compiler
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          RUSTC="$(find build \
            -type f \
            -path '*aarch64-linux-android*' \
            -name rustc \
            -perm -111 \
            | head -1)"

          if [ -z "$RUSTC" ]; then
            echo "Android rustc was not found."
            exit 1
          fi

          echo "Found:"
          echo "$RUSTC"

          cp "$RUSTC" \
            dist/rustc-aarch64-linux-android

          chmod +x \
            dist/rustc-aarch64-linux-android

          file \
            dist/rustc-aarch64-linux-android

          ls -lh dist/

          sha256sum dist/*

      - name: Upload compiler
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rustc-aarch64-linux-android
          path: dist/
          if-no-files-found: error=======================

      - name: Install Android Rust toolchain
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX="$GITHUB_WORKSPACE/android-rust"

          rm -rf "$PREFIX"
          mkdir -p "$PREFIX"

          for archive in build/dist/*-${HOST}.tar.gz; do

            [ -f "$archive" ] || continue

            echo
            echo "Installing:"
            echo "$archive"

            dirname="$(mktemp -d)"

            tar \
              -xzf "$archive" \
              -C "$dirname"

            installer="$(find "$dirname" \
              -maxdepth 2 \
              -name install.sh \
              -type f \
              | head -n 1)"

            if [ -z "$installer" ]; then
              echo "No install.sh found in $archive"
              exit 1
            fi

            chmod +x "$installer"

            "$installer" \
              --prefix="$PREFIX"

            rm -rf "$dirname"

          done

          echo
          echo "Installed prefix:"
          du -sh "$PREFIX"

          find "$PREFIX/bin" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 15. Verify that the produced compiler is actually Android
      # ============================================================

      - name: Verify native Android compiler
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX="$GITHUB_WORKSPACE/android-rust"

          test -x "$PREFIX/bin/rustc"

          echo "================================================"
          echo "rustc binary"
          echo "================================================"

          file "$PREFIX/bin/rustc"

          echo
          echo "================================================"
          echo "ELF header"
          echo "================================================"

          readelf -h "$PREFIX/bin/rustc" \
            | grep -E \
              'Class:|Machine:|OS/ABI:'

          echo
          echo "================================================"
          echo "Version"
          echo "================================================"

          "$PREFIX/bin/rustc" --version || true
          "$PREFIX/bin/rustc" -vV || true

      # ============================================================
      # 16. Verify required Rust libraries exist
      # ============================================================

      - name: Verify Rust sysroot
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX="$GITHUB_WORKSPACE/android-rust"
          LIB="$PREFIX/lib/rustlib/${HOST}/lib"

          test -d "$LIB"

          echo "Rust sysroot:"
          du -sh "$LIB"

          echo
          echo "rlib count:"
          find "$LIB" \
            -maxdepth 1 \
            -name '*.rlib' \
            | wc -l

          echo
          echo "rmeta count:"
          find "$LIB" \
            -maxdepth 1 \
            -name '*.rmeta' \
            | wc -l

          echo
          echo "Example libraries:"
          find "$LIB" \
            -maxdepth 1 \
            -name '*.rlib' \
            -printf '%f\n' \
            | sort \
            | head -30

          test "$(find "$LIB" -maxdepth 1 -name '*.rlib' | wc -l)" -gt 10

      # ============================================================
      # 17. Prepare Termux package
      #
      # Keep the complete sysroot.
      # Do NOT remove .rlib files.
      # ============================================================

      - name: Prepare Termux package
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX="$GITHUB_WORKSPACE/android-rust"

          mkdir -p release

          cat > "$PREFIX/INSTALL-TERMUX.txt" <<EOF
          Native Rust compiler for Android ARM64.

          Target/host:
            ${HOST}

          Built for:
            Termux / Android ARM64

          Install:
            tar -xJf rust-${RUST_VERSION}-${HOST}-termux.tar.xz -C \$PREFIX

          Test:
            rustc --version
            rustc -vV

          Compile:
            rustc hello.rs

          Cargo:
            cargo --version
            cargo new hello
            cd hello
            cargo run

          IMPORTANT:
            Keep the complete lib/rustlib/${HOST}/lib directory.
            The .rlib files are required by rustc.
          EOF

          cd "$PREFIX"

          tar \
            -cJf \
            "$GITHUB_WORKSPACE/release/rust-${RUST_VERSION}-${HOST}-termux.tar.xz" \
            .

      # ============================================================
      # 18. SHA-256
      # ============================================================

      - name: Create checksum
        shell: bash
        run: |
          set -euxo pipefail

          cd release

          sha256sum \
            "rust-${RUST_VERSION}-${HOST}-termux.tar.xz" \
            > \
            "rust-${RUST_VERSION}-${HOST}-termux.tar.xz.sha256"

          cat \
            "rust-${RUST_VERSION}-${HOST}-termux.tar.xz.sha256"

          ls -lh

      # ============================================================
      # 19. Upload final artifact
      # ============================================================

      - name: Upload Rust Android toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ env.RUST_VERSION }}-${{ env.HOST }}-termux
          path: |
            release/*.tar.xz
            release/*.sha256
          if-no-files-found: error
